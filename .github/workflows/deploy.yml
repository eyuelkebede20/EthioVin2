name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Frontend
        working-directory: ./client
        env:
          VITE_BACKEND_URL: https://ethiovinapi.senaycreatives.com
        run: |
          npm install
          npm run build

      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./client/dist/
          server-dir: /public_html/ethiovin/

      # Bundle the backend to plain JS on the (Linux) runner, so production runs
      # `node dist/index.js` — no tsx/esbuild native binaries needed on the host.
      - name: Build Backend
        working-directory: ./backend
        run: |
          npm install
          npm run build

      - name: Trigger cPanel Passenger Restart
        run: |
          mkdir -p backend/tmp
          # Write CHANGING content so the FTP delta-sync actually re-uploads the
          # file (an empty `touch` keeps the same size/content and gets skipped),
          # which refreshes its mtime and makes Passenger/LiteSpeed restart.
          echo "restart ${GITHUB_SHA} $(date +%s)" > backend/tmp/restart.txt

      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /ethiovin-api/
          exclude: |
            **/.env
            **/node_modules/**
            **/.git/**
            **/.github/**
            README.md
